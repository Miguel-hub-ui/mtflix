<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTFlix — Watch</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="styles.css?v=23" />
</head>
<body class="watch-page" data-page="watch">

  <div class="watch-shell" id="modal-overlay">
    <a href="index.html" class="watch-back-link" id="watch-back">‹ Back</a>

    <div class="watch-card">
      <div class="watch-card-head">
        <span class="watch-brand-name">MTFLIX</span>
        <span class="watch-type-tag" id="watch-type-tag">Movie</span>
        <div class="watch-source-dropdown" id="watch-source-dropdown">
          <button type="button" class="watch-source-btn" id="watch-source-btn">
            <span id="watch-source-label">Source</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="watch-source-menu" id="watch-source-menu"></div>
        </div>
      </div>
      <div id="modal-hero" class="watch-stage"></div>
    </div>

    <div class="watch-info">
      <span class="watch-info-label">NOW PLAYING</span>
      <h2 class="watch-info-title" id="watch-info-title">&nbsp;</h2>
      <div class="watch-info-divider"></div>
      <p class="watch-info-desc" id="watch-info-desc"></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script src="app.js?v=43"></script>
</body>
</html>
